<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>Host — Đấu giá</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-app">

<div class="topbar">
  <div class="title">🎤 Host</div>
  <div class="right">
    <span class="pill lobby" id="phasePill">Sảnh chờ</span>
    <span id="netStatus">🟢</span>
  </div>
</div>

<main class="wrap">
  <div class="card-stack">

    <!-- Điều khiển -->
    <section class="panel" id="controlPanel">
      <div id="lobbyBox">
        <p class="muted">Sẵn sàng khi mọi người đã vào phòng.</p>
        <button class="btn btn-primary btn-lg" id="btnStart">Bắt đầu vòng 1</button>
      </div>

      <div id="biddingBox" class="hidden">
        <div class="strip">
          <span><b id="bidCount">0</b> đã đặt giá</span>
          <span class="countdown-sm" id="countdown">01:00</span>
        </div>
        <p class="muted center mt">Bid đang được giữ kín.</p>
        <div class="btn-row mt">
          <button class="btn btn-accent btn-lg" id="btnReveal">Chốt lượt</button>
          <button class="btn btn-ghost" id="btnExtend">+30s</button>
        </div>
      </div>

      <div id="revealBox" class="hidden">
        <div id="revealBanner"></div>
        <div id="revealList" class="bid-list"></div>
        <div class="btn-row mt">
          <button class="btn btn-primary btn-lg" id="btnNext">Lượt tiếp theo</button>
          <button class="btn btn-ghost" id="btnSkipToFill">Lấp đầy</button>
        </div>
      </div>

      <div id="doneBox" class="hidden">
        <div class="ok-box">Giải đã hoàn tất.</div>
        <div class="btn-row mt">
          <button class="btn btn-warn" id="btnFill2">Chạy vòng bổ sung</button>
          <button class="btn btn-danger" id="btnReset">Chơi lại</button>
        </div>
      </div>
    </section>

    <!-- Nam đang đấu giá -->
    <section class="panel hidden" id="malePanel">
      <div id="auctionArea"></div>
    </section>

    <!-- Đội hình -->
    <section class="panel">
      <h3>Đội hình <span class="count" id="teamsDone">0/6</span></h3>
      <div id="teams" class="team-rows"></div>
    </section>

    <!-- Cân bằng -->
    <section class="panel" id="balancePanel">
      <h3>Cân bằng <span class="count" id="balanceStd">—</span></h3>
      <div id="balanceVerdict"></div>
    </section>

    <!-- Người online -->
    <section class="panel">
      <h3>Đang online <span class="count" id="presenceCount">0</span></h3>
      <div class="presence" id="presence"></div>
    </section>

  </div>
</main>

<div id="toast"></div>

<script type="module" src="js/pages/host.js"></script>
</body>
</html>
