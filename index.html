<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>Đấu giá cầu lông</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-center">

<main class="card card-lg">
  <header class="brand">
    <div class="logo">🏸</div>
    <h1>Đấu Giá Cầu Lông</h1>
    <p class="muted" id="eventName">Giải Cầu Lông Vui Vẻ</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="host" role="tab">Host</button>
    <button class="tab" data-tab="player" role="tab">Người chơi</button>
    <button class="tab" data-tab="spectator" role="tab">Xem</button>
  </nav>

  <section class="tab-panel active" data-panel="host">
    <label class="field">
      <span>Mật khẩu host</span>
      <input id="hostSecret" type="password" placeholder="••••••" />
    </label>
    <button class="btn btn-primary btn-lg" id="hostGo">Vào phòng Host</button>
  </section>

  <section class="tab-panel" data-panel="player">
    <div class="field">
      <span>Tôi là</span>
      <div class="female-picker" id="femalePicker"></div>
    </div>
    <label class="field">
      <span>Mật khẩu</span>
      <input id="playerSecret" type="password" inputmode="numeric" placeholder="••••••" />
    </label>
    <button class="btn btn-primary btn-lg" id="playerGo">Vào đấu giá</button>
  </section>

  <section class="tab-panel" data-panel="spectator">
    <p class="muted">Xem trực tiếp, không thể đặt giá.</p>
    <button class="btn btn-primary btn-lg" id="specGo">Xem bảng đấu giá</button>
  </section>
</main>

<script type="module" src="js/pages/landing.js"></script>
</body>
</html>
