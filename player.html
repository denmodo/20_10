<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>Đấu giá</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-app">

<div class="topbar">
  <div class="title">🙋 <span id="playerName">—</span></div>
  <div class="right">
    <span class="pill lobby" id="phasePill">Sảnh chờ</span>
    <span id="netStatus">🟢</span>
  </div>
</div>

<main class="wrap">
  <div class="card-stack">

    <!-- Nam đang đấu giá -->
    <section class="panel hidden" id="malePanel">
      <div id="auctionArea"></div>
    </section>

    <!-- Đặt giá / kết quả -->
    <section class="panel" id="actionPanel">
      <div id="waitBox">
        <p class="muted center">Đang chờ host mở lượt…</p>
      </div>

      <div id="formBox" class="hidden">
        <div class="strip">
          <span>Còn <b id="myLeft">0</b> điểm</span>
          <span class="countdown-sm" id="countdown">01:00</span>
        </div>

        <label class="field mt">
          <span>Trả cho nam này</span>
          <input id="bidAmount" type="number" min="0" step="1" inputmode="numeric" value="0" />
        </label>

        <div class="quick-row">
          <button class="chip" data-quick="min">Sàn</button>
          <button class="chip" data-quick="plus">+5</button>
          <button class="chip" data-quick="plus10">+10</button>
          <button class="chip" data-quick="max">Max</button>
          <button class="chip" data-quick="skip">Bỏ</button>
        </div>

        <div id="bidHint" class="hint"></div>
        <div id="bidError" class="warn-box hidden"></div>
        <button class="btn btn-primary btn-lg mt" id="btnBid">Đặt giá</button>
        <div id="bidStatus" class="mt center"></div>
      </div>

      <div id="revealBox" class="hidden"></div>
    </section>

    <!-- Đội của bạn -->
    <section class="panel">
      <h3>Đội của bạn</h3>
      <div id="myTeam"></div>
    </section>

    <!-- Các đội khác -->
    <section class="panel">
      <h3>Các đội khác</h3>
      <div id="otherTeams" class="team-rows"></div>
    </section>

  </div>
</main>

<div id="toast"></div>

<script type="module" src="js/pages/player.js"></script>
</body>
</html>
