<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>Bảng đấu giá</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-app">

<div class="topbar">
  <div class="title">👀 Bảng đấu giá</div>
  <div class="right">
    <span class="pill lobby" id="phasePill">Sảnh chờ</span>
    <span id="netStatus">🟢</span>
  </div>
</div>

<main class="wrap">
  <div class="card-stack">

    <section class="panel hidden" id="malePanel">
      <div id="auctionArea"></div>
      <div id="revealBox"></div>
    </section>

    <section class="panel">
      <h3>Đội hình <span class="count" id="teamsDone">0/6</span></h3>
      <div id="teams" class="team-rows"></div>
    </section>

    <section class="panel">
      <h3>Cân bằng <span class="count" id="stdLabel">σ —</span></h3>
      <div id="balanceVerdict"></div>
    </section>

  </div>
</main>

<div id="toast"></div>
<script type="module" src="js/pages/spectator.js"></script>
</body>
</html>
